<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
<form method="post">
	
<label for="name">Name</label>
	<input type="text" name="name" id="name" required>
<br><br>
	
<label for="email">Email</label>
	<input type="email" name="email" id="email" required>
<br><br>
	<label>Gender</label>
	<input type="radio" name="gender_m" id="gender" required>
<label for="gender_m">Male</label>
	
	<input type="radio" name="gender_f" id="gender" required>
<label for="gender_f">Female</label>
<br><br>
	
<label for="cars">Car Brands</label>
	<select id="cars" name="cars">
		<option value="BMW">BMW</option>
		<option value="Audi">Audi</option>
		<option value="Mercedez">Mercedez</option>		
	</select>
<br><br>
	
<label for="age">Car Age</label>
        <input type="number" id="age" name="age" required>
        <br><br>

        <label for="dop">DOP</label>
        <input type="date" id="dop" name="dop" required>
        <br><br>
<label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

	 <button type="submit">Submit</button>
	
</form>

	
    <script type="text/javascript" src="./script.js">
</script>

	
</body>

</html>
